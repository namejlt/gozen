# Database configuration
mysql:
  db_name: user_service
  pool:
    pool_min_cap: 5
    pool_max_cap: 20
    pool_idle_timeout: 60000
    pool_life_timeout: 60000
  write:
    address: 127.0.0.1
    port: 3306
    user: root
    password: root
  reads:
    - address: 127.0.0.1
      port: 3306
      user: root
      password: root

redis:
  address:
    - 127.0.0.1:6379
  db: 0
  pool_max_active: 10
  pool_min_active: 2
